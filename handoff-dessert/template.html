<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siena Ristorante — Dessert Menu</title>
<style>
@font-face {
  font-family: 'Playfair Display';
  src: url('fonts/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Playfair Display';
  src: url('fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/*
  PHYSICAL PRODUCT — read this before touching layout.
  ======================================================
  One 8.5in x 11in sheet, cut in half to make TWO DIFFERENT 4.25in x 11in
  insert cards — Dolci (left) and Siena Dopa Cena (right) — same size and
  same holder as the 4 cards in ../handoff-drinksdessert/. This used to
  be two IDENTICAL copies of a Dolci-only card; it is NOT that anymore —
  the right half is a completely different card (Dopa Cena moved here
  from the Drinks Menu). If you find old code/docs assuming two identical
  copies, they're stale. See BUILD-SPEC.md \u00a70.

  THE CUT GUIDE NEVER PRINTS. The dashed line between the two halves is
  an on-screen/editor placement aid only — real print output must not
  include it, ever (see .cut-guide's @media print rule below). Staff cut
  at the known 4.25in mark; don't reintroduce a printed guide line.

  HOLDER CROP LINE — same fixed constant as the Drinks Menu. Neither of
  these two cards may have its last line render below 9.96in from its
  own top edge; see ../handoff-drinksdessert/validate.js and
  BUILD-SPEC.md \u00a71b for the full explanation (it's a hardware constant
  of the shared menu holder, not tied to either card's content).
*/
@page { size: 8.5in 11in; margin: 0; }

body {
  font-family: 'Montserrat', sans-serif;
  background: #fff;
  color: #3a1a06;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.sheet {
  width: 8.5in;
  height: 11in;
  display: flex;
  position: relative;
  background: #fff;
}

.cut-guide {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 0;
  border-left: 1px dashed #3a1a06;
  pointer-events: none;
}
@media print {
  /* Never printed — placement aid only. See file header. */
  .cut-guide { display: none !important; }
}

@media screen {
  body { background: #e8dfd2; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .sheet { box-shadow: 0 4px 24px rgba(0,0,0,0.18); }
}
@media print {
  body { background: #fff; padding: 0; display: block; }
  .sheet { box-shadow: none; }
}

.page {
  width: 4.25in;
  height: 11in;
  box-sizing: border-box;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #faf6ef;
}
.page[data-page-id="dolci"] { padding: 0.55in 0.42in 0.4in; }
.page[data-page-id="dopacena"] { padding: 0.25in 0.4in 0.6in; }

.page-title { text-align: center; flex-shrink: 0; }
.page-title-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
.page-title-rule { height: 1px; width: 32px; background: #3a1a06; opacity: 0.75; }
.page-title-text {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  color: #3a1a06;
  white-space: nowrap;
}
/* Dolci keeps the flanking-rule title treatment, larger than the other
   menus' page titles. Dopa Cena's title is plain centered text — no
   rules. This asymmetry is deliberate; don't normalize them. */
.page[data-page-id="dolci"] .page-title { margin-bottom: 21pt; }
.page[data-page-id="dolci"] .page-title-text { font-size: 28.5pt; }
.page[data-page-id="dopacena"] .page-title { margin-bottom: 10.5pt; }
.page[data-page-id="dopacena"] .page-title-text { font-size: 20.25pt; }

/*
  Dolci content is NOT centered in the space below the title — it sits
  roughly a quarter of the way down (halfway between "pinned to the top"
  and "perfectly centered"). Implemented as two flex spacers around the
  list in a 1:3 ratio (top:bottom); a plain `justify-content: center`
  would put it at 1:1. Do not "fix" this to true centering — it was a
  deliberate placement so the affogato illustration reads as a bottom
  anchor rather than crowding the list. See BUILD-SPEC \u00a71 and \u00a72.
*/
.dolci-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.dolci-spacer-top { flex: 1; }
.dolci-spacer-bottom { flex: 3; }
.dolci-image {
  width: 150px;
  margin: 0 auto;
  display: block;
  flex-shrink: 0;
}

.item-list { display: flex; flex-direction: column; }

/* ── Dolci — centered name/price row + wrapping description ── */
.item-list[data-list-id="dolci"] .item { margin-bottom: 19.5pt; }
.item-list[data-list-id="dolci"] .item:last-child { margin-bottom: 0; }
.item-list[data-list-id="dolci"] .row { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.dessert-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 16.5pt; color: #3a1a06; }
.dessert-price { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 14.25pt; color: #3a1a06; line-height: 1.15; }
.dessert-desc { font-family: 'Montserrat', sans-serif; font-size: 12pt; color: #4a3a26; line-height: 1.4; margin-top: 4.5pt; padding: 0 8px; text-align: center; text-wrap: pretty; }

/* ── Dopa Cena — left-aligned name, right-aligned price, 5 fixed
   subsections, each open-ended, any item MAY carry a one-line sub-desc
   (e.g. a grappa's producing region) ── */
.subsection-title-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.subsection-title-rule { height: 1px; width: 12px; background: #3a1a06; opacity: 0.5; }
.subsection-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 9.75pt; color: #3a1a06; }
.page[data-page-id="dopacena"] .subsection-title-row:first-of-type { margin: 1.5pt 0 3.75pt; }
.page[data-page-id="dopacena"] .subsection-title-row:not(:first-of-type) { margin: 16.5pt 0 3.75pt; }

.item-list[data-list-id^="dopacena-"] .item { margin-bottom: 3pt; }
.item-list[data-list-id^="dopacena-"] .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.item-name { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 12.5pt; color: #3a1a06; line-height: 1.15; }
.item-price { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 11.25pt; color: #3a1a06; white-space: nowrap; }
.item-sub { font-family: 'Montserrat', sans-serif; font-size: 9pt; color: #6b4c2a; margin-top: -1px; }

/*
  ── THE ONLY SIZE FLEX THIS LAYOUT ALLOWS ──
  validate.js measures the Dolci and Dopa Cena pages INDEPENDENTLY (they
  are two different cards now, unlike the old two-identical-copies model)
  — see BUILD-SPEC \u00a71. If a page overflows OR crosses the holder crop
  line at normal size, validate.js adds "shrink-1pt" to that page only
  and re-measures. Titles and subsection titles are static chrome and
  are never touched. The Dolci illustration is a fixed-size static asset
  and does not shrink either.
*/
.page.shrink-1pt .dessert-name  { font-size: 15.5pt; }
.page.shrink-1pt .dessert-price { font-size: 13.25pt; }
.page.shrink-1pt .dessert-desc  { font-size: 11pt; }
.page.shrink-1pt .item-name     { font-size: 11.5pt; }
.page.shrink-1pt .item-price    { font-size: 10.25pt; }
.page.shrink-1pt .item-sub      { font-size: 8.25pt; }
</style>
</head>
<body>

<div class="sheet" data-sheet-id="dessert">

  <div class="page" data-page-id="dolci">
    <div class="page-title">
      <div class="page-title-row">
        <div class="page-title-rule"></div>
        <div class="page-title-text">Dolci</div>
        <div class="page-title-rule"></div>
      </div>
    </div>
    <div class="dolci-body">
      <div class="dolci-spacer-top"></div>
      <div class="item-list" data-list-id="dolci"></div>
      <div class="dolci-spacer-bottom"></div>
    </div>
    <!-- Static asset, not a data field — see BUILD-SPEC \u00a76. -->
    <img class="dolci-image" src="assets/dolci-affogato-sketch.png" alt="">
  </div>

  <div class="cut-guide"></div>

  <div class="page" data-page-id="dopacena">
    <div class="page-title">
      <div class="page-title-text">Siena Dopa Cena</div>
    </div>

    <div class="subsection-title-row"><div class="subsection-title-rule"></div><div class="subsection-title">Digestivo</div><div class="subsection-title-rule"></div></div>
    <div class="item-list" data-list-id="dopacena-digestivo"></div>

    <div class="subsection-title-row"><div class="subsection-title-rule"></div><div class="subsection-title">Grappa &middot; 2.5 oz</div><div class="subsection-title-rule"></div></div>
    <div class="item-list" data-list-id="dopacena-grappa"></div>

    <div class="subsection-title-row"><div class="subsection-title-rule"></div><div class="subsection-title">Ports &middot; 2.5 oz</div><div class="subsection-title-rule"></div></div>
    <div class="item-list" data-list-id="dopacena-ports"></div>

    <div class="subsection-title-row"><div class="subsection-title-rule"></div><div class="subsection-title">Cognac &amp; Calvados</div><div class="subsection-title-rule"></div></div>
    <div class="item-list" data-list-id="dopacena-cognac"></div>

    <div class="subsection-title-row"><div class="subsection-title-rule"></div><div class="subsection-title">Traditional Italian &middot; 2.5 oz</div><div class="subsection-title-rule"></div></div>
    <div class="item-list" data-list-id="dopacena-traditionalItalian"></div>
  </div>

</div>

<!-- render.js clones one of these per JSON item, into the matching
     [data-list-id] container. -->
<template id="dolci-item-template"><div class="item"><div class="row"><span class="dessert-name"></span><span class="dessert-price"></span></div><div class="dessert-desc"></div></div></template>
<template id="dopacena-item-template"><div class="item"><div class="row"><span class="item-name"></span><span class="item-price"></span></div><div class="item-sub"></div></div></template>

<script src="validate.js"></script>

</body>
</html>
