<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Siena Ristorante — Drinks Menu</title>
<style>
/* ── Self-hosted fonts ── */
@font-face {
  font-family: 'Playfair Display';
  src: url('fonts/PlayfairDisplay-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Playfair Display';
  src: url('fonts/PlayfairDisplay-Italic-VariableFont_wght.ttf') format('truetype');
  font-weight: 100 900; font-style: italic; font-display: swap;
}
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/*
  PHYSICAL PRODUCT — read this before touching layout.
  ======================================================
  This menu is four narrow 4.25in × 11in insert cards that slide into a
  hard menu holder (corners hold each card in place). Dolci is its own
  separate insert product (see ../Dessert Menu.dc.html) — it is NOT part
  of this package. This package's four cards are produced from TWO
  physical 8.5×11 sheets, each cut in half top-to-bottom:

    Sheet A  =  [ Signature Cocktails | Spritz Menu    ]  → cut → 2 cards
    Sheet B  =  [ Spirits & Beer      | Liquori         ]  → cut → 2 cards

  Each <div class="sheet"> below is one physical 8.5×11 print page holding
  two <div class="page"> halves (4.25in each) side by side, with a dashed
  cut-guide down the middle. If only one page changes, the shop reprints
  that sheet only. See BUILD-SPEC.md "Printing & reprints".

  THE HOLDER CROP LINE — a second, stricter constraint than "fits on the
  card". =====================================================================
  The physical menu holder's viewing window does not show the full 11in
  of each card — everything below 9.96in from the top of any card is
  hidden behind the holder frame. This is a FIXED hardware constant, not
  tied to any one card's current content. It happens to equal where the
  Signature Cocktails card's last line currently falls, but if Cocktails'
  content later gets shorter, this line does NOT move up — treat 9.96in
  as permanent. validate.js enforces it on all four cards independently
  from the normal end-of-card overflow check. See BUILD-SPEC.md §1b.

  SPRITZ MENU — dual design, one shared data set.
  ================================================
  The Spritz card has TWO interchangeable designs the manager can toggle
  between at any time: "a" (single-column list) and "b" (grouped by
  flavor profile). Both read from the exact same `data.spritz.items`
  array — there is only one data set, never two. Design "b" additionally
  sorts items by `item.category`; design "a" ignores `category` entirely.
  The header block (kicker, title, "Choose Your Spirit" subhead, price,
  tagline) is IDENTICAL between designs and lives once in the DOM — only
  the item-list portion below it swaps. See BUILD-SPEC.md §1a.

  LATEST REVISION — Signature Cocktails + Spirits & Beer.
  =========================================================
  "Aperol Spritz" was removed from Signature Cocktails (redundant now
  that Spritz has its own dedicated card). The whole Cocktails card was
  then shifted down 0.5in (padding-top 0.3in → 0.8in). Net result: ~0.5in
  of slack now exists above the holder crop line (§1b) — enough for a
  short one-line addition but NOT a full new drink with a two-line
  description without trimming something else first. On Spirits & Beer,
  the "Bottled Beer" heading got an extra gap before its first item (on
  top of its existing accent treatment). Spritz Menu and Liquori are
  UNCHANGED from the prior handoff.

  [data-crop-exempt] (Aug 2026, Joe — NOT part of the designer's
  contract): an element (and everything nested inside it) is excluded
  from the crop-line measurement entirely — validate.js's
  contentBottomIn() walks up with .closest() and skips anything inside
  one, same idea as [data-decorative] but for a subtree with real text,
  not a single decorative image. Currently only on Bottled Beer's
  heading row + item list, because that block's text is centered — the
  physical corner-clip risk the crop line protects against is specific
  to text sitting flush against the left/right edge, so centered text
  can safely sit lower than 9.96in without actually being clipped by the
  holder's corner grips. Owner's explicit call, not a blanket exemption:
  don't add this attribute to any other block without checking first —
  it only holds because the content under it is centered. (The
  designer's BUILD-SPEC.md §5 now documents this rationale in prose, but
  the actual attribute/logic still isn't in their delivered files as of
  this handoff — keep re-applying both halves together.)
*/
@page { size: 8.5in 11in; margin: 0; }

body {
  font-family: 'Montserrat', sans-serif;
  background: #fff;
  color: #3a1a06;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.sheet {
  width: 8.5in;
  height: 11in;
  display: flex;
  page-break-after: always;
  position: relative;
  background: #fff;
}
.sheet:last-child { page-break-after: auto; }

.cut-guide {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 0;
  border-left: 1px dashed #3a1a06;
  pointer-events: none;
}

@media screen {
  body { background: #e8dfd2; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .sheet { box-shadow: 0 4px 24px rgba(0,0,0,0.18); }
}
@media print {
  body { background: #fff; padding: 0; display: block; }
  .sheet { box-shadow: none; }
  /* Editor sets one of these classes on <body> before window.print() to
     reprint a single sheet. Default (neither class) prints both. */
  body.print-sheet-a-only .sheet[data-sheet-id="b"] { display: none; }
  body.print-sheet-b-only .sheet[data-sheet-id="a"] { display: none; }
  /* Screen-only staff reference for where to cut the sheet in half — must
     never appear on the physical printed page. Not part of the designer's
     handoff; re-applied on every install since a wholesale template swap
     silently drops it (bit us once already, Aug 2026). */
  .cut-guide { display: none; }
}

.page {
  width: 4.25in;
  height: 11in;
  box-sizing: border-box;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.page[data-page-id="cocktails"] { padding: 0.8in 0.42in 0.4in; }
.page[data-page-id="liquori"] { padding: 0.3in 0.42in 0.4in; }
.page[data-page-id="spirits"] { padding: 0.25in 0.4in 1.1in; }
.page[data-page-id="spritz"] { padding: 0.25in 0.4in 0.35in; }

.page-title {
  text-align: center;
  flex-shrink: 0;
}
.page-title-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.page-title-rule { height: 1px; width: 28px; background: #3a1a06; opacity: 0.75; }
.page-title-text {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 22.5pt;
  color: #3a1a06;
  white-space: nowrap;
}
/* Cocktails and Spirits & Beer titles are plain centered text — no
   flanking rules. Spritz and Liquori keep the flanking-rule treatment
   (via .page-title-row, only used in those two pages' markup).
   NOTE: these are physical px values copied 1:1 from the design mockup —
   do NOT run them through any px→pt conversion; only font-size uses that
   conversion (see BUILD-SPEC.md "Exact-value parity" section). */
.page[data-page-id="cocktails"] .page-title { margin-bottom: 36px; }
.page[data-page-id="spirits"]   .page-title { margin-bottom: 16px; }
.page[data-page-id="liquori"]   .page-title { margin-bottom: 20px; }
.page[data-page-id="spritz"]    .page-title { margin-bottom: 4px; }

/* ── Spritz header chrome — identical across both designs, never toggled ── */
.spritz-kicker { text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 8.25pt; letter-spacing: 0.18em; color: #6b4c2a; text-transform: uppercase; margin-bottom: 3px; margin-top: 0.5in; }
.spritz-subhead { text-align: center; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 12pt; letter-spacing: 0.12em; text-transform: uppercase; color: #3a1a06; margin: 0 0 10px; }
.spritz-price { text-align: center; margin: 0 0 10px; }
.spritz-price-text { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 24pt; color: #3a1a06; }
.spritz-tagline-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 0 0 12px; }
.spritz-tagline { font-family: 'Montserrat', sans-serif; font-weight: 700; font-style: italic; font-size: 9.75pt; color: #4a3a26; line-height: 1.4; text-align: center; padding: 0 6px; }

/* Design toggle — default is design "a"; render.js adds spritz-design-b to
   <body> when data.spritz.design === "b" (or the render() opts override
   requests it). Only the header above is shared; everything below swaps. */
.spritz-body-b { display: none; }
body.spritz-design-b .spritz-body-a { display: none; }
body.spritz-design-b .spritz-body-b { display: flex; flex-direction: column; }

/* Item name is Playfair Display italic, matching the cocktail-name
   treatment — NOT Montserrat. Description stays Montserrat. */
.spritz-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; color: #3a1a06; line-height: 1.2; }
.spritz-desc { font-family: 'Montserrat', sans-serif; color: #6b4c2a; line-height: 1.3; }
.item-list[data-list-id="spritz-a"] .item { margin-bottom: 5px; }
.item-list[data-list-id="spritz-a"] .spritz-name { font-size: 12.975pt; }
.item-list[data-list-id="spritz-a"] .spritz-desc { font-size: 10.725pt; margin-top: 1px; }
.item-list[data-list-id^="spritz-b-"] .item { margin-bottom: 5px; }
.item-list[data-list-id^="spritz-b-"] { margin-bottom: 2px; }
.item-list[data-list-id="spritz-b-bright"] .spritz-name { font-size: 12.975pt; }
.item-list[data-list-id="spritz-b-bright"] .spritz-desc { font-size: 10.725pt; margin-top: 1px; }
/* Groups AFTER "Bitter & Bright" (Herbal & Aromatic, Rich & Earthy) run
   1pt larger than Bitter & Bright itself — a deliberate, current design
   decision, not a bug. Bitter & Bright stays at the base size above.
   (All three groups got a further +1pt bump this revision — see
   BUILD-SPEC.md changelog — these ARE the post-bump sizes.) */
.item-list[data-list-id="spritz-b-herbal"] .spritz-name,
.item-list[data-list-id="spritz-b-earthy"] .spritz-name { font-size: 13.725pt; }
.item-list[data-list-id="spritz-b-herbal"] .spritz-desc,
.item-list[data-list-id="spritz-b-earthy"] .spritz-desc { font-size: 11.475pt; margin-top: 1px; }

/* Spritz Design B group headings — Bitter & Bright / Herbal & Aromatic /
   Rich & Earthy — get small flanking rules either side of the label
   (added on top of the plain subsection-title treatment below). Fixed
   labels/order, not editable — see BUILD-SPEC.md §5. */
.page[data-page-id="spritz"] .subsection-title-row { margin: 4px 0 4px; }
/* "Bitter & Bright" (the first group) gets an extra 0.5in of clearance
   above it, pushing the whole group down — this closes what used to be
   an odd-looking gap between it and "Herbal & Aromatic" below. */
.page[data-page-id="spritz"] .subsection-title-row:first-of-type { margin-top: 0.5in; }
.page[data-page-id="spritz"] .subsection-title-row:first-of-type .subsection-title { font-size: 10.725pt; }
.page[data-page-id="spritz"] .subsection-title-row:not(:first-of-type) .subsection-title { font-size: 11.475pt; }
.subsection-title-rule--sub { height: 1px; width: 12px; background: #3a1a06; opacity: 0.5; }

.subsection-title-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.subsection-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 10.5pt;
  color: #3a1a06;
}
.page[data-page-id="spirits"] .subsection-title-row { margin: 8px 0 4px; }
.page[data-page-id="spirits"] .subsection-title-row:first-of-type { margin-top: 2px; }
.page[data-page-id="liquori"] .subsection-title-row { margin: 8px 0 4px; }
.page[data-page-id="liquori"] .subsection-title-row:first-of-type { margin-top: 2px; }

/* Bottled Beer — the one Spirits & Beer subsection with the accent
   treatment: bigger type + flanking rules (unlike Bourbon/Scotch, which
   stay plain). Static chrome, not editable — see BUILD-SPEC.md §5.
   Margin is scoped to .page[data-page-id="spirits"] specifically so it
   beats the generic .page[...] .subsection-title-row rule above on
   specificity — a plain `.subsection-title-row--accent` selector here
   LOSES that tie-break and silently gets overridden; this is the exact
   bug that made Bottled Beer sit in the wrong place. Don't de-scope it. */
.subsection-title-row--accent { gap: 8px; }
.page[data-page-id="spirits"] .subsection-title-row--accent { margin: calc(9px + 0.15in) 0 13px; }
.subsection-title--accent { font-size: 15pt; font-weight: 700; }
.subsection-title-rule--accent { height: 1px; width: 16px; background: #3a1a06; opacity: 0.6; }

.item-list { display: flex; flex-direction: column; }

/* ── Cocktails — name/price row + wrapping description + optional note ── */
.item-list[data-list-id="cocktails"] .item { margin-bottom: 21px; }
.item-list[data-list-id="cocktails"] .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cocktail-name { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 15.75pt; color: #3a1a06; line-height: 1.15; }
.cocktail-price { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 13.5pt; color: #3a1a06; line-height: 1.15; white-space: nowrap; }
.cocktail-desc { font-family: 'Montserrat', sans-serif; font-size: 12pt; color: #4a3a26; line-height: 1.38; margin-top: 3px; text-wrap: pretty; }
.cocktail-note { font-family: 'Montserrat', sans-serif; font-size: 9.75pt; color: #6b4c2a; margin-top: 3px; }
/* Static asset, bottom of the Cocktails card — added this revision,
   same decorative treatment/exemption as .spritz-image below. */
.cocktails-image { width: 108px; margin: 18px auto 0; display: block; flex-shrink: 0; }

/* ── Spirits & Liquori (name + price only, no description) — same
   visual treatment on both pages ── */
.item-list[data-list-id^="spirits-"] .item { margin-bottom: 2px; }
.item-list[data-list-id^="liquori-"] .item { margin-bottom: 3px; }
.item-list[data-list-id^="spirits-"] .row, .item-list[data-list-id^="liquori-"] .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.item-name { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 12.15pt; color: #3a1a06; line-height: 1.15; }
.item-price { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: 11.25pt; color: #3a1a06; white-space: nowrap; }

/* Bottled Beer items are centered with an inline em-dash price, unlike
   Bourbon/Scotch's name-left/price-right row — a deliberate, current
   design decision. Uses the same .item/.row/.item-name/.item-price DOM
   from plain-item-template; only the layout is overridden here, AFTER
   the general spirits-/liquori- rule above so it wins the tie in
   specificity (both selectors are equally specific). */
.item-list[data-list-id="spirits-beer"] .item { text-align: center; }
.item-list[data-list-id="spirits-beer"] .row { display: inline; }
.item-list[data-list-id="spirits-beer"] .item-price::before { content: " \2014 "; }

/*
  ── THE ONLY SIZE FLEX THIS LAYOUT ALLOWS ──
  validate.js measures each .page. If content overflows at normal size, it
  adds "shrink-1pt" to THAT page only and re-measures. Every dynamic
  (data-driven) text run below drops by exactly 1pt — static chrome
  (page titles, subsection titles, cut-guide) is NEVER touched. If the
  page still overflows after this one step, validate.js reports it and the
  editor blocks the save. There is no second shrink step. This shrink is
  independent of, and does not affect, the holder-crop-line check (§1b) —
  a page can pass the crop line at normal size and still need the shrink
  for the ordinary bottom-of-card overflow check, or vice versa.
*/
.page.shrink-1pt .cocktail-name  { font-size: 14.75pt; }
.page.shrink-1pt .cocktail-price { font-size: 12.5pt; }
.page.shrink-1pt .cocktail-desc  { font-size: 11pt; }
.page.shrink-1pt .cocktail-note  { font-size: 8.75pt; }
.page.shrink-1pt .item-name      { font-size: 11.15pt; }
.page.shrink-1pt .item-price     { font-size: 10.25pt; }
.page.shrink-1pt .item-list[data-list-id="spritz-a"] .spritz-name,
.page.shrink-1pt .item-list[data-list-id="spritz-b-bright"] .spritz-name { font-size: 11.975pt; }
.page.shrink-1pt .item-list[data-list-id="spritz-a"] .spritz-desc,
.page.shrink-1pt .item-list[data-list-id="spritz-b-bright"] .spritz-desc { font-size: 9.725pt; }
.page.shrink-1pt .item-list[data-list-id="spritz-b-herbal"] .spritz-name,
.page.shrink-1pt .item-list[data-list-id="spritz-b-earthy"] .spritz-name { font-size: 12.725pt; }
.page.shrink-1pt .item-list[data-list-id="spritz-b-herbal"] .spritz-desc,
.page.shrink-1pt .item-list[data-list-id="spritz-b-earthy"] .spritz-desc { font-size: 10.475pt; }
/* Static asset — never shrunk, never measured against the holder crop
   line (see validate.js's contentBottomIn, which skips [data-decorative]
   elements). See BUILD-SPEC.md §1a/§5. */
.spritz-image { width: 108px; margin: 8px auto 0; display: block; flex-shrink: 0; }
/* Growth release valve (Cocktails + Spritz) \u2014 render.js toggles
   `.hide-image` on the .page once item count crosses its threshold (see
   BUILD-SPEC.md "Growth headroom"). Hiding is plain display:none inside
   a flex column, so the space it occupied closes automatically.
   IMPORTANT \u2014 this only fixes the plain bottom-of-11in-card overflow
   check. It does NOT move the holder-crop-line check at all: validate.js's
   contentBottomIn deliberately skips [data-decorative] elements (these
   images), so hiding one can never change cropLineOk. Cocktails' growth
   problem IS the physical-card overflow \u2014 hiding fixes it outright.
   Spritz's growth problem is the STRICTER crop line, which the image was
   never counted against either way \u2014 spritz needs `.spritz-compact`
   below to actually recover crop-line room; hiding its image alongside
   that is a cosmetic pairing, not the fix. */
.page.hide-image .cocktails-image,
.page.hide-image .spritz-image { display: none; }

/* Spritz "full" state \u2014 render.js adds this at spritz.items.length >= 10
   (see BUILD-SPEC.md "Growth headroom"). Tightens header + item spacing
   and drops the +1pt bump added this revision, recovering the room 2
   extra items need to clear the 9.96in holder crop line. Static chrome
   colors/weights are untouched \u2014 only spacing and the two dynamic text
   sizes change. */
.page.spritz-compact .spritz-kicker { margin-top: 0.3in; margin-bottom: 2px; }
.page.spritz-compact .spritz-subhead { margin: 0 0 6px; }
.page.spritz-compact .spritz-price { margin: 0 0 6px; }
.page.spritz-compact .spritz-tagline-wrap { gap: 3px; margin: 0 0 8px; }
.page.spritz-compact .subsection-title-row:first-of-type { margin-top: 0.15in; }
.page.spritz-compact .subsection-title-row { margin: 3px 0 3px; }
.page.spritz-compact .subsection-title-row .subsection-title { font-size: 10.5pt; }
.page.spritz-compact .item-list[data-list-id^="spritz-b-"] .item,
.page.spritz-compact .item-list[data-list-id="spritz-a"] .item { margin-bottom: 3px; }
.page.spritz-compact .spritz-name { font-size: 12pt; line-height: 1.1; }
.page.spritz-compact .spritz-desc { font-size: 9.75pt; line-height: 1.2; margin-top: 0px; }
</style>
</head>
<body>

<!-- SHEET A — Signature Cocktails | Spritz Menu -->
<div class="sheet" data-sheet-id="a">

  <div class="page" data-page-id="cocktails">
    <div class="page-title">
      <div class="page-title-text">Signature Cocktails</div>
    </div>
    <div class="item-list" data-list-id="cocktails"></div>
    <img class="cocktails-image" src="assets/cocktails-martini-sketch.png" alt="" data-decorative>
  </div>

  <div class="cut-guide"></div>

  <div class="page" data-page-id="spritz">
    <div class="spritz-kicker">new</div>
    <div class="page-title">
      <div class="page-title-row">
        <div class="page-title-rule"></div>
        <div class="page-title-text">Spritz Menu</div>
        <div class="page-title-rule"></div>
      </div>
    </div>
    <div class="spritz-subhead">Choose Your Spirit</div>
    <div class="spritz-price"><span class="spritz-price-text"></span></div>
    <div class="spritz-tagline-wrap">
      <div class="spritz-tagline">every spritz is topped with prosecco and soda</div>
    </div>

    <!-- Design A: single flat list, ignores item.category -->
    <div class="item-list spritz-body-a" data-list-id="spritz-a"></div>

    <!-- Design B: grouped by item.category. Fixed group order/labels, each
         flanked by small rules — not editable. -->
    <div class="spritz-body-b">
      <div class="subsection-title-row"><div class="subsection-title-rule--sub"></div><div class="subsection-title">Bitter &amp; Bright</div><div class="subsection-title-rule--sub"></div></div>
      <div class="item-list" data-list-id="spritz-b-bright"></div>
      <div class="subsection-title-row"><div class="subsection-title-rule--sub"></div><div class="subsection-title">Herbal &amp; Aromatic</div><div class="subsection-title-rule--sub"></div></div>
      <div class="item-list" data-list-id="spritz-b-herbal"></div>
      <div class="subsection-title-row"><div class="subsection-title-rule--sub"></div><div class="subsection-title">Rich &amp; Earthy</div><div class="subsection-title-rule--sub"></div></div>
      <div class="item-list" data-list-id="spritz-b-earthy"></div>
      <!-- Static asset, not a data field — see BUILD-SPEC.md §5. -->
      <img class="spritz-image" src="assets/spritz-garnish-sketch.png" alt="" data-decorative>
    </div>
  </div>

</div>

<!-- SHEET B — Spirits & Beer | Liquori -->
<div class="sheet" data-sheet-id="b">

  <div class="page" data-page-id="spirits">
    <div class="page-title">
      <div class="page-title-text">Spirits &amp; Beer</div>
    </div>
    <div class="subsection-title-row"><div class="subsection-title">Rye / Whiskey / Bourbon</div></div>
    <div class="item-list" data-list-id="spirits-bourbon"></div>
    <div class="subsection-title-row"><div class="subsection-title">Single Malt Scotch Whisky</div></div>
    <div class="item-list" data-list-id="spirits-scotch"></div>
    <div class="subsection-title-row subsection-title-row--accent" data-crop-exempt><div class="subsection-title-rule--accent"></div><div class="subsection-title subsection-title--accent">Bottled Beer</div><div class="subsection-title-rule--accent"></div></div>
    <div class="item-list" data-list-id="spirits-beer" data-crop-exempt></div>
  </div>

  <div class="cut-guide"></div>

  <div class="page" data-page-id="liquori">
    <div class="page-title">
      <div class="page-title-row">
        <div class="page-title-rule"></div>
        <div class="page-title-text">Liquori</div>
        <div class="page-title-rule"></div>
      </div>
    </div>
    <!-- Fixed category order: Tequila, Gin, Vodka, Rum — see BUILD-SPEC.md §1c.
         Each list is pre-sorted highest price to lowest and trimmed to fit
         both the card bottom AND the holder crop line (§1b); validate.js
         cannot auto-trim, so this trimming is done by hand when the source
         liquor list changes — see §1c for the process. -->
    <div class="subsection-title-row"><div class="subsection-title">Tequila</div></div>
    <div class="item-list" data-list-id="liquori-tequila"></div>
    <div class="subsection-title-row"><div class="subsection-title">Gin</div></div>
    <div class="item-list" data-list-id="liquori-gin"></div>
    <div class="subsection-title-row"><div class="subsection-title">Vodka</div></div>
    <div class="item-list" data-list-id="liquori-vodka"></div>
    <div class="subsection-title-row"><div class="subsection-title">Rum</div></div>
    <div class="item-list" data-list-id="liquori-rum"></div>
  </div>

</div>
